name: Build TWRP Recovery

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      twrp_branch:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-12.1'
        type: choice
        options:
          - twrp-12.1
          - twrp-14

jobs:
  build:
    name: Build TWRP Recovery
    runs-on: ubuntu-22.04

    steps:
    - name: Cleanup Runner Disk Space
      uses: rokibhasansagar/slimhub_actions@main

    - name: Setup Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/realme/RMX5079

    - name: Setup Build Packages
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 libncurses5 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
          libxml2 libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 rsync bc ccache \
          schedtool lzop libssl-dev openjdk-11-jdk
        sudo ln -sf /usr/bin/python3 /usr/bin/python || true

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize and Sync TWRP Manifest
      run: |
        mkdir -p ~/twrp
        cd ~/twrp
        git config --global user.name "Builder"
        git config --global user.email "builder@github.com"
        
        BRANCH="twrp-12.1"
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          BRANCH="${{ github.event.inputs.twrp_branch }}"
        fi
        echo "Using TWRP branch: $BRANCH"
        
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b $BRANCH
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune

    - name: Copy Device Tree to Manifest
      run: |
        mkdir -p ~/twrp/device/realme
        cp -r device/realme/RMX5079 ~/twrp/device/realme/

    - name: Build TWRP Recovery
      run: |
        cd ~/twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        
        echo "=== Lunching Target ==="
        lunch twrp_RMX5079-eng || lunch twrp_RMX5079-userdebug
        
        echo "=== Building Recovery Image ==="
        make recoveryimage -j$(nproc --all) || make bootimage -j$(nproc --all)
        
        echo "=== Collecting Output Images ==="
        mkdir -p $GITHUB_WORKSPACE/output
        find out/target/product/ -type f -name "*.img" -exec cp -v {} $GITHUB_WORKSPACE/output/ \;
        
        echo "=== Output Files in Workspace ==="
        ls -la $GITHUB_WORKSPACE/output/

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-RMX5079-Output
        path: output/*
        if-no-files-found: warn
