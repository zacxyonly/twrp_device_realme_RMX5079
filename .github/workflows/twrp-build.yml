name: Build TWRP Recovery

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      twrp_branch:
        description: 'TWRP Manifest Branch'
        required: true
        default: 'twrp-14'
        type: choice
        options:
          - twrp-14
          - twrp-12.1

jobs:
  build:
    name: Build TWRP
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Device Tree
      uses: actions/checkout@v4
      with:
        path: device/realme/RMX5079

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /var/lib/mysql
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo apt-get clean
        df -h

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
          libc6-dev-i386 libncurses5 libncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
          libxml2 libxml2-utils xsltproc unzip fontconfig python3 rsync

    - name: Install Repo Tool
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize TWRP Manifest
      run: |
        mkdir -p ~/twrp
        cd ~/twrp
        git config --global user.name "Builder"
        git config --global user.email "builder@github.com"
        BRANCH="${{ github.event.inputs.twrp_branch || 'twrp-14' }}"
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b $BRANCH
        repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

    - name: Copy Device Tree to Manifest
      run: |
        mkdir -p ~/twrp/device/realme
        cp -r device/realme/RMX5079 ~/twrp/device/realme/

    - name: Build TWRP
      run: |
        cd ~/twrp
        source build/envsetup.sh
        lunch twrp_RMX5079-eng || lunch twrp_RMX5079-userdebug
        mka recoveryimage -j$(nproc --all) || mka bootimage -j$(nproc --all)

    - name: Upload Recovery Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-RMX5079-Output
        path: |
          ~/twrp/out/target/product/RMX5079/*.img
